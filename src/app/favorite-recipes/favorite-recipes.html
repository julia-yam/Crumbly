<section class="favorite-recipes" aria-label="Избранные рецепты">
  <div class="container">

    <div class="favorite-recipes__grid">
      @for (recipe of favoriteRecipes(); track recipe.id) {
        <app-recipe-card
          [id]="recipe.id"
          [title]="recipe.title"
          [image]="recipe.image"
          [isFavorite]="recipe.isFavorite"
          (favoriteToggle)="toggleFavorite(recipe.id)"
          (removeRecipe)="removeRecipe(recipe.id)"
        >
          <p class="recipe-caption">Домашняя коллекция ♡</p>
        </app-recipe-card>
      } @empty {
        <p class="favorite-recipes__empty">
          В избранном пока пусто. Отметь понравившийся рецепт сердечком ♡
        </p>
      }
    </div>
  </div>
</section>
