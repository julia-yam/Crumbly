<section class="recipes" aria-labelledby="recipes-title">
  <div class="container">
    <div class="recipes__intro">

        Щепотка вдохновения на каждый день
        <span aria-hidden="true">♡</span>
      </p>

      <h1 id="recipes-title" class="recipes__title">

        Любимые рецепты для уютных завтраков и тёплых вечеров

    <div class="recipes__grid">
      <article class="recipe-card">

          height="480"

        <div class="recipe-card__content">
          <span class="recipe-card__category">Завтрак</span>

          <h2 class="recipe-card__title">Сырники с ягодами</h2>

            <span>25 минут</span>
            <span aria-hidden="true">·</span>
            <span>2 порции</span>
          </p>
        </div>
      </article>

      <article class="recipe-card">
        <img
          class="recipe-card__image"
          src="images/pasta.png"

          width="600"
          height="480"
        />

        <div class="recipe-card__content">
          <span class="recipe-card__category">Обед</span>

          <h2 class="recipe-card__title">Сливочная паста</h2>

          <p class="recipe-card__details">
            <span>30 минут</span>
            <span aria-hidden="true">·</span>
            <span>2 порции</span>
          </p>
        </div>
      </article>

      <article class="recipe-card">
        <img
          class="recipe-card__image"
          src="images/apple-pie.png"

          width="600"
          height="480"
        />

        <div class="recipe-card__content">
          <span class="recipe-card__category">Выпечка</span>

          <h2 class="recipe-card__title">Яблочный пирог</h2>

          <p class="recipe-card__details">
            <span>50 минут</span>
            <span aria-hidden="true">·</span>
            <span>6 порций</span>
          </p>
        </div>
