<section class="recipes" aria-labelledby="recipes-title">
  <div class="container">
    <div class="recipes__intro">
      @let total = recipes.length;

      <h1 id="recipes-title" class="recipes__title">
        Мои рецепты <span class="recipes__count">{{ total }}</span>
      </h1>

      <p class="recipes__description">Любимые рецепты для уютных завтраков и тёплых вечеров</p>
    </div>

    <div class="recipes__grid">
      @for (recipe of recipes; track recipe.id) {
        <article class="recipe-card">
          <div class="recipe-card__image" aria-hidden="true"></div>

          <div class="recipe-card__content">
            <span class="recipe-card__label">Любимый рецепт ♡</span>

            <h2 class="recipe-card__title">
              {{ recipe.title }}
            </h2>
          </div>
        </article>
      } @empty {
        <p class="recipes__empty">Рецептов пока нет. Добавьте первый рецепт! 🍓</p>
      }
    </div>
  </div>
</section>
