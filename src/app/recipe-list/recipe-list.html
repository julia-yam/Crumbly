<section class="recipes" aria-labelledby="recipes-title">
  <div class="container">
    <div class="recipes__intro">
      <h1 id="recipes-title" class="recipes__title">
        Мои рецепты
        <span class="recipes__count">{{ totalCount() }}</span>
      </h1>
    </div>

    <div class="recipes__grid">
      @for (recipe of recipes(); track recipe.id) {
        <app-recipe-card
          [title]="recipe.title"
          [image]="recipe.image"
          [isFavorite]="recipe.isFavorite"
          (favoriteToggle)="toggleFavorite(recipe.id)"
          (removeRecipe)="removeRecipe(recipe.id)"
        >
          <p class="recipe-caption">Домашняя коллекция ♡</p>
        </app-recipe-card>
      } @empty {
        <p class="recipes__empty">
            Рецептов пока нет. Добавьте первый рецепт! 🍓
        </p>
      }
    </div>
  </div>
</section>
