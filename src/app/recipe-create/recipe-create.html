<section class="create-recipe">
  <div class="container">
    <div class="create-recipe__intro">
      <h1>Добавить рецепт</h1>

      <p class="create-recipe__description">Запиши идею блюда, чтобы не забыть её.</p>
    </div>

    <div class="recipe-form">
      <h2>Расскажи о блюде</h2>

      <div class="recipe-form__preview">
        <img src="images/recipe-placeholder.svg" alt="Заглушка для нового рецепта" />
      </div>

      <div class="recipe-form__field">
        <label for="recipe-title">Название рецепта</label>
        <input
          id="recipe-title"
          type="text"
          placeholder="Например, сырники с ягодами"
          #recipeName
        />
      </div>

      <button
        type="button"
        class="recipe-form__button"
        (click)="onAddRecipe(recipeName.value)"
      >
        Сохранить рецепт
      </button>
    </div>
  </div>
</section>

@if (isSuccessMessageVisible()) {
  <div class="success-modal" role="dialog" aria-modal="true" aria-labelledby="success-modal-title">
    <div class="success-modal__card">
      <span class="success-modal__icon" aria-hidden="true">♡</span>
      <h2 id="success-modal-title">Рецепт сохранён!</h2>
      <p>Он уже ждёт тебя в коллекции рецептов.</p>
      <button type="button" (click)="closeSuccessMessage()">Понятно</button>
    </div>
  </div>
}
