<label class="favorite-filter">
  <input
    class="favorite-filter__input"
    type="checkbox"
    [checked]="showOnlyFavorites()"
    (change)="showOnlyFavorites.set($any($event.target).checked)"
  />

  <span class="favorite-filter__switch" aria-hidden="true"></span>

  <span class="favorite-filter__text">
    Только избранное ♡
  </span>
</label>
