<header class="header">
  <div class="container header__inner">
    <a class="logo" routerLink="/" aria-label="Crumbly — главная"> crumbly </a>
  </div>

  <nav class="header__navigation" aria-label="Основная навигация">
    <div class="container header__navigation-inner">
      <a
        class="header__navigation-button"
        routerLink="/"
        routerLinkActive="header__navigation-button--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Главная
      </a>

      <a
        class="header__navigation-button"
        routerLink="/recipes"
        [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
        routerLinkActive="header__navigation-button--active"
      >
        Рецепты
      </a>

      <a
        class="header__navigation-button"
        routerLink="/recipes/favorites"
        routerLinkActive="header__navigation-button--active"
      >
        Избранное
      </a>

      <a
        class="header__navigation-button"
        routerLink="/create"
        routerLinkActive="header__navigation-button--active"
      >
        Добавить рецепт
      </a>
    </div>
  </nav>
</header>
