<article class="recipe-card">
  <a class="recipe-card__image-link" [routerLink]="['/details', id()]">
    <img class="recipe-card__image" [src]="image()" [alt]="title()" />
  </a>

  <div class="recipe-card__content">
    <h2 class="recipe-card__title">
      <a class="recipe-card__title-link" [routerLink]="['/details', id()]">
        {{ title() }}
      </a>
    </h2>

    <div class="recipe-card__extra">
      <ng-content></ng-content>
    </div>

    <div class="recipe-card__actions">
      <button
        type="button"
        class="favorite-button"
        [class.favorite-button--active]="isFavorite()"
        (click)="favoriteToggle.emit()"
      >
        @if (isFavorite()) {
          ❤️ В избранном
        } @else {
          🤍 В избранное
        }
      </button>
      <button
        type="button"
        class="delete-button"
        (click)="removeRecipe.emit()"
        aria-label="Удалить рецепт {{ title() }}"
      >
        Удалить
      </button>
    </div>
  </div>
</article>
